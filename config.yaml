seed: 42

model:
  name_or_path: llava-hf/llava-1.5-7b-hf
  torch_dtype: float16
  gradient_checkpointing: true
  attn_implementation: null   # 可选: flash_attention_2 / sdpa / null

data:
  path: json
  data_files: /ppio_net0/code/LFactory/data/mllm_demo.json
  image_root: /ppio_net0/code/LFactory/data
  max_length: 4096

loader:
  batch_size: 1
  shuffle: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules_regex: null  # 留空则自动只匹配 model.language_model 下的 Linear

train:
  output_dir: /ppio_net0/code/LFactory/outputs/llava15_7b_lora_lightning
  lr: 2.0e-4
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-4

trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  strategy: auto
  precision: 16-mixed         # 更稳；如果你强制纯 fp16，可改成 16-true
  max_epochs: 3
  accumulate_grad_batches: 8  # 用梯度累积拉大有效 batch
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  save_lightning_ckpt: false
